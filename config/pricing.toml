# Model prices in USD per 1M tokens, for the Usage view's cost estimates.
# Keyed by provider kind, then the API model id the agent sends. Only prices
# read on the provider's own pricing page on the `checked` date; anything
# missing shows as "unknown". Operator overrides (PUT /v1/usage/prices) win.
#
# - cache_write is Anthropic's 5-minute cache write; 1-hour writes cost more.
# - A dated id (claude-sonnet-4-5-20250929) falls back to its undated entry.
# - codex uses the openai entries, gemini_cli the gemini ones. Ollama is free.
# - Long-prompt tiers are not modelled: where a page lists a higher price above
#   a prompt length, the entry says so (input / output / cache_read) and
#   holds the lower price. Dated price changes are noted the same way.
# - Not listed on purpose: claude-haiku-5-5 (prompts over 100k tokens cost
#   5x, which agents reach often), gpt-5.6-* (cache write prices whose usage
#   field is undocumented), Bedrock, Vertex and OpenRouter (not checked).

[anthropic."claude-fable-5-2"]
input = 8.0
output = 40.0
cache_read = 0.20
cache_write = 10.0
checked = "2026-11-20"
source = "https://platform.claude.com/docs/en/about-claude/pricing"

