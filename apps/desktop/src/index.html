<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ferrobot</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <aside class="sidebar">
      <header class="brand">ferrobot <span id="health" class="muted"></span></header>
      <ul id="agents" class="agents" aria-label="Agents"></ul>
      <form id="new-agent" class="new-agent">
        <input name="name" placeholder="new agent name" pattern="[a-z][a-z0-9-]{0,31}" required />
        <textarea name="instructions" rows="2" placeholder="role / instructions"></textarea>
        <button type="submit">Create agent</button>
      </form>
      <p id="error" class="error" role="alert"></p>
    </aside>
    <main class="chat">
      <header class="chat-header">
        <h1 id="title">Select an agent</h1>
        <div class="actions">
          <button id="interrupt" type="button" disabled>Interrupt</button>
          <button id="stop" type="button" disabled>Stop</button>
          <button id="wake" type="button" disabled>Wake</button>
        </div>
      </header>
      <ol id="timeline" class="timeline" aria-live="polite"></ol>
      <form id="composer" class="composer">
        <textarea name="body" rows="2" placeholder="Message… (try: @bob hello)" disabled></textarea>
        <button type="submit" disabled>Send</button>
      </form>
    </main>
  </body>
</html>
