[package]
name = "ferrobot-desktop"
description = "Tauri shell for the ferrobot chat UI (UI only, talks to ferrobotd over HTTP/WS)."
version = "0.1.6"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

# Standalone workspace: building the core never requires WebKitGTK.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
