name: Release

# Runs only when a maintainer pushes a v* tag. Builds the desktop app with the
# daemon as a sidecar, pushes the runner image, and leaves a DRAFT release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # One draft up front, so both desktop jobs upload to the same release.
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$GITHUB_REF_NAME" \
            -f name="$GITHUB_REF_NAME" -f body="See CHANGELOG.md." -F draft=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  runner-image:
    name: Runner image (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-24.04
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ferrobot-runner" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runner/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
      - run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.os }}
          path: /tmp/digests/*
          retention-days: 1

  runner-manifest:
    name: Runner image manifest
    needs: runner-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: /tmp/digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ferrobot-runner"
          docker buildx imagetools create -t "$image:${GITHUB_REF_NAME#v}" \
            $(printf "$image@sha256:%s " *)

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            triple: universal-apple-darwin
            # `app` makes the updater archive (.app.tar.gz); dmg alone does not.
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Windows
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop

      - name: Build the daemon sidecar (macOS, universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release -p ferrobot-daemon --target aarch64-apple-darwin
          cargo build --release -p ferrobot-daemon --target x86_64-apple-darwin
          mkdir -p apps/desktop/src-tauri/binaries
          lipo -create -output apps/desktop/src-tauri/binaries/ferrobotd-${{ matrix.triple }} \
            target/aarch64-apple-darwin/release/ferrobotd target/x86_64-apple-darwin/release/ferrobotd
          # Each architecture's build checks for its own sidecar; the bundle takes the universal one.
          cp target/aarch64-apple-darwin/release/ferrobotd apps/desktop/src-tauri/binaries/ferrobotd-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/ferrobotd apps/desktop/src-tauri/binaries/ferrobotd-x86_64-apple-darwin
      - name: Build the daemon sidecar (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release -p ferrobot-daemon
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/ferrobotd.exe apps/desktop/src-tauri/binaries/ferrobotd-${{ matrix.triple }}.exe

      # Signing is optional: without these secrets the build is unsigned.
      - name: Use macOS signing secrets if present
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              {
                echo "$name<<__EOF__"
                echo "$value"
                echo "__EOF__"
              } >> "$GITHUB_ENV"
            fi
          done
      - name: Use the Windows signing certificate if present
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP cert.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } } | ConvertTo-Json -Compress -Depth 5
          Set-Content -Path apps/desktop/src-tauri/tauri.signing.conf.json -Value $config
          "SIGNING_ARGS=--config src-tauri/tauri.signing.conf.json" >> $env:GITHUB_ENV

      # The updater key signs the update archives that latest.json points at. Without it the
      # build still runs, just without updater artifacts.
      - name: Skip updater artifacts without the signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > apps/desktop/src-tauri/tauri.no-updater.conf.json
            echo "UPDATER_ARGS=--config src-tauri/tauri.no-updater.conf.json" >> "$GITHUB_ENV"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.draft.outputs.id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json ${{ env.SIGNING_ARGS }} ${{ env.UPDATER_ARGS }}

  checksums:
    name: SHA256SUMS
    needs: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --pattern '*.exe'
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
