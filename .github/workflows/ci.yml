name: CI

# Actions minutes are scarce: PRs only, no docs-only runs, every job capped.
# Full gates run locally (CLAUDE.md); E2E only by hand ("Run workflow").
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, tests, API spec drift)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Core crates must build without the optional schema derives (plain types).
      - run: cargo check -p ferrobot-core -p ferrobot-store -p ferrobot-sandbox
      # Includes tests/specs.rs: fails if protocol/*.json is stale.
      - run: cargo test --workspace

  ts:
    name: Runner and desktop (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            runner/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci && npm run lint && npm run format:check && npm run typecheck && npm test && npm run build
        working-directory: runner
      # Generated TS types must match protocol/openapi.json. The Tauri shell
      # (no logic, needs the WebKit packages) is checked locally only.
      - run: npm ci && npm run check:api && npm run typecheck && npm test && npm run build
        working-directory: apps/desktop

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on vulnerabilities only; unmaintained crates stay warnings (docs/decisions.md).
      - run: cargo audit && cargo audit --file apps/desktop/src-tauri/Cargo.lock
      - run: npm audit --audit-level=moderate
        working-directory: runner
      - run: npm audit --audit-level=moderate
        working-directory: apps/desktop

  docker:
    name: E2E (Docker backend)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runner/package-lock.json
      - run: npm ci && npm run build
        working-directory: runner
      - run: cargo test -p ferrobot-daemon --test e2e -- --ignored
      - run: docker build -f runner/Dockerfile -t ferrobot-runner:dev .
      - run: cargo test -p ferrobot-sandbox --features docker-tests --test docker
      - run: cargo test -p ferrobot-daemon --features docker-tests --test e2e docker_backend -- --ignored
      - run: ./scripts/smoke-docker.sh
