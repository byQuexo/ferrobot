name: CI

# Actions minutes are scarce: PRs and merges to main, docs-only changes skip the real jobs,
# every job capped. Full gates run locally (CLAUDE.md); E2E only by hand ("Run workflow").
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Skipped jobs count as passed for required checks; a skipped workflow would stay pending.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # A pull request checks out its merge commit and main only gets merge commits: either way
      # the first parent is the base.
      - id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          if printf '%s\n' "$files" | grep -qvE '^docs/|\.md$'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: Rust (fmt, clippy, tests, API spec drift)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Core crates must build without the optional schema derives (plain types).
      - run: cargo check -p ferrobot-core -p ferrobot-store -p ferrobot-sandbox
      # Includes tests/specs.rs: fails if protocol/*.json is stale.
      - run: cargo test --workspace

  ts:
    name: Runner and desktop (TypeScript)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            runner/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci && npm run lint && npm run format:check && npm run typecheck && npm test && npm run build
        working-directory: runner
      # Generated TS types must match protocol/openapi.json. The Tauri shell
      # (no logic, needs the WebKit packages) is checked locally only.
      - run: npm ci && npm run lint && npm run format:check && npm run check:api && npm run typecheck && npm test && npm run build
        working-directory: apps/desktop

  audit:
    name: Dependency audit
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on vulnerabilities only; unmaintained crates stay warnings (docs/decisions.md).
      - run: cargo audit && cargo audit --file apps/desktop/src-tauri/Cargo.lock
      # Shipped dependencies from moderate up; dev tooling (lint, build) from high up.
      - run: npm audit --omit=dev --audit-level=moderate && npm audit --audit-level=high
        working-directory: runner
      - run: npm audit --omit=dev --audit-level=moderate && npm audit --audit-level=high
        working-directory: apps/desktop

  docker:
    name: E2E (Docker backend)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runner/package-lock.json
      - run: npm ci && npm run build
        working-directory: runner
      - run: cargo test -p ferrobot-daemon --test e2e -- --ignored
      - run: docker build -f runner/Dockerfile -t ferrobot-runner:dev .
      - run: cargo test -p ferrobot-sandbox --features docker-tests --test docker
      - run: cargo test -p ferrobot-daemon --features docker-tests --test e2e docker_backend -- --ignored
      - run: ./scripts/smoke-docker.sh
