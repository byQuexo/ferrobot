name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, tests, API spec drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Core crates must build without the optional schema derives (plain types).
      - run: cargo check -p ferrobot-core -p ferrobot-store -p ferrobot-sandbox
      # Includes tests/specs.rs: fails if protocol/*.json is stale.
      - run: cargo test --workspace

  runner:
    name: Runner (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runner/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (local-process backend, real runner)
    needs: [rust, runner]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runner/package-lock.json
      - run: npm ci && npm run build
        working-directory: runner
      - run: cargo test -p ferrobot-daemon --test e2e -- --ignored

  docker:
    name: E2E (Docker backend)
    needs: [rust, runner]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: docker build -f runner/Dockerfile -t ferrobot-runner:dev .
      - run: cargo test -p ferrobot-sandbox --features docker-tests --test docker
      - run: cargo test -p ferrobot-daemon --features docker-tests --test e2e -- --ignored
      - run: ./scripts/smoke-docker.sh

  desktop:
    name: Desktop (thin Tauri UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
        working-directory: apps/desktop
      # Generated TS types must match protocol/openapi.json.
      - run: npm run check:api
        working-directory: apps/desktop
      - run: npm run typecheck && npm test && npm run build
        working-directory: apps/desktop
      - run: cargo fmt --check && cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
