[workspace]
resolver = "3"
members = ["crates/core", "crates/store", "crates/sandbox", "crates/mcp", "crates/daemon"]
# The Tauri shell has its own workspace so the core build never needs WebKitGTK.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.7"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/byQuexo/ferrobot"
authors = ["Tim Gühnemann"]

[workspace.dependencies]
ferrobot-core = { path = "crates/core" }
ferrobot-store = { path = "crates/store" }
ferrobot-sandbox = { path = "crates/sandbox" }
ferrobot-mcp = { path = "crates/mcp" }

anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
bollard = "0.21"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.11", features = ["server", "transport-streamable-http-server", "macros"] }
rusqlite = { version = "0.43", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal", "process", "fs", "io-util"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
clap = { version = "4", features = ["derive", "env"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
sha2 = "0.10"
hex = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
croner = "4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
keyring = "4.2.0"
object_store = { version = "0.14.2", default-features = false }
url = "2"
utoipa = { version = "6", features = ["macros", "time", "uuid", "preserve_order"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
