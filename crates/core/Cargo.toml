[package]
name = "ferrobot-core"
description = "Domain types and the daemon <-> runner wire protocol for ferrobot."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
# Derives `utoipa::ToSchema` for API documentation. Off by default so the
# crate stays plain (e.g. for a future UniFFI binding).
schema = ["dep:utoipa"]
mcp = ["dep:schemars"]

[dependencies]
utoipa = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true

[lints]
workspace = true
