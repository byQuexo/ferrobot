[package]
name = "ferrobot-store"
description = "SQLite persistence for ferrobot: agent registry, mailbox, memory, events, routines."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
# Derives `utoipa::ToSchema` for API documentation. Off by default so the
# crate stays plain (e.g. for a future UniFFI binding).
schema = ["dep:utoipa", "ferrobot-core/schema"]

[dependencies]
utoipa = { workspace = true, optional = true }
ferrobot-core.workspace = true
hex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
