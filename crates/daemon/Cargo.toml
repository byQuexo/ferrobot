[package]
name = "ferrobot-daemon"
description = "ferrobotd: agent registry, mailbox dispatcher, MCP server and HTTP/WebSocket API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ferrobotd"
path = "src/main.rs"

[features]
docker-tests = []

[dependencies]
utoipa.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
clap.workspace = true
ferrobot-core = { workspace = true, features = ["schema"] }
ferrobot-mcp.workspace = true
ferrobot-sandbox = { workspace = true, features = ["schema"] }
ferrobot-store = { workspace = true, features = ["schema"] }
futures-util.workspace = true
croner.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
iana-time-zone.workspace = true
keyring.workspace = true
object_store = { workspace = true, features = ["fs", "aws"] }
reqwest = { workspace = true, features = ["stream"] }
sha2.workspace = true
time = { workspace = true, features = ["macros"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
jsonschema = { version = "0.61", default-features = false }
tempfile.workspace = true
tokio-tungstenite.workspace = true

[lints]
workspace = true
