[package]
name = "ferrobot-daemon"
description = "ferrobotd: agent registry, mailbox dispatcher, MCP server and HTTP/WebSocket API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ferrobotd"
path = "src/main.rs"

[features]
docker-tests = []

[dependencies]
utoipa.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
ferrobot-core = { workspace = true, features = ["schema"] }
ferrobot-mcp.workspace = true
ferrobot-sandbox = { workspace = true, features = ["schema"] }
ferrobot-store = { workspace = true, features = ["schema"] }
futures-util.workspace = true
croner.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
iana-time-zone.workspace = true
keyring.workspace = true
object_store = { workspace = true, features = ["fs", "aws"] }
reqwest = { workspace = true, features = ["stream"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest", "auth", "transport-async-rw"] }
# Already in the tree via rustls: HMAC for share links, AES-GCM for archives.
ring = "0.17"
# The local CA and leaf certificates of the CLI-login proxy (approved 2026-11-26).
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
# Already in the tree via reqwest: TLS and HTTP/1 on the CLI-login proxy's side of the tunnel.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
hyper = { workspace = true, features = ["http1", "server", "client"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true
# Same version rmcp uses; for RFC 7009 token revocation on sign-out.
oauth2 = { version = "5.0", default-features = false }
sha2.workspace = true
hex.workspace = true
time = { workspace = true, features = ["macros"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true
# Already in the tree via proc-macro-crate; only the parser, so no new crates.
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
jsonschema = { version = "0.61", default-features = false }
rusqlite.workspace = true
tokio-tungstenite.workspace = true

[lints]
workspace = true
